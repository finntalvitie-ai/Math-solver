<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Solver</title>
<meta name="description" content="Write any math problem with Apple Pencil and get it solved step by step by Claude.">
<meta name="theme-color" content="#F5F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Math Solver">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header class="masthead">
    <h1>Math Solver</h1>
    <p>Write any math problem with Apple Pencil. Claude reads it and solves it step by step.</p>
  </header>

  <section class="card setup" id="setup" hidden></section>

  <div class="layout">
    <main class="col-main">
      <section class="card">
        <div class="card-head">
          <h2>Your problem</h2>
          <div class="tools">
            <button type="button" class="tool" id="tool-pen" aria-pressed="true">Pen</button>
            <button type="button" class="tool" id="tool-eraser" aria-pressed="false">Eraser</button>
            <button type="button" class="tool plain" id="pad-undo">Undo</button>
            <button type="button" class="tool plain" id="pad-clear">Clear</button>
          </div>
        </div>
        <canvas id="pad" aria-label="Writing pad. Write your math problem here with Apple Pencil or your finger."></canvas>

        <div class="extras">
          <div class="photo-row">
            <label class="tool plain file-btn" for="photo">Add a photo</label>
            <input type="file" id="photo" accept="image/*" class="visually-hidden">
            <div id="photo-preview" class="photo-preview" hidden>
              <img id="photo-img" alt="Photo of the problem">
              <button type="button" class="tool plain" id="photo-remove">Remove photo</button>
            </div>
          </div>
          <label for="typed" class="label">Or type it (optional)</label>
          <textarea id="typed" rows="2" spellcheck="false" placeholder="e.g. A train travels 240 km in 3 hours. What is its average speed?"></textarea>
        </div>

        <button type="button" class="primary wide" id="solve-btn">Solve</button>
      </section>

      <section class="card" id="result" aria-live="polite" hidden></section>

      <section class="card" id="followup" hidden>
        <h2>Ask about this problem</h2>
        <div id="thread" class="thread"></div>
        <form id="ask-form" class="ask-row">
          <label for="ask" class="visually-hidden">Your question</label>
          <textarea id="ask" rows="1" placeholder="e.g. Why did you divide by 3?"></textarea>
          <button type="submit" class="primary" id="ask-btn">Ask</button>
        </form>
      </section>
    </main>

    <aside class="col-side">
      <section class="card" id="graph-card" hidden>
        <h2>Graph</h2>
        <div id="graph" class="graph"></div>
      </section>
      <section class="card">
        <h2>Recent</h2>
        <div class="list" id="history"></div>
      </section>
      <section class="card">
        <h2>Claude</h2>
        <div id="claude-settings"></div>
      </section>
    </aside>
  </div>
</div>
<script src="solver.js"></script>
<script src="app.js"></script>
</body>
</html>
